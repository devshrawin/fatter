<!-- Dev tool. Needs sample photos in _test-photos/ (gitignored, not shipped). -->
<!doctype html>
<meta charset="utf-8">
<title>sevenseg sweep</title>
<body style="background:#111;color:#ddd;font:11px ui-monospace,monospace;margin:0;padding:6px">
<div id="sum" style="padding:4px 0;font-size:13px"></div>
<div id="out" style="display:flex;flex-wrap:wrap;gap:6px"></div>
<script src="../js/sevenseg.js"></script>
<script>
const P='../_test-photos/';
const FILES=["B7315BD2-58E3-4EAA-BD4D-D8A0E64A37C1.JPG","CCCD27EA-1E70-4173-B313-E605D284B849.JPG",
"DFFCEFAE-32C6-4DD7-A382-8D14FBAF42D9.JPG","E4BCA611-F3CB-4378-B926-02FE977997EA.JPG",
"E591CBCA-12A2-4B57-865B-ED3DAC377003.JPG","EAFE2C62-2EB3-47DB-B139-A17E70C321A5.JPG",
"FB44E818-F4D5-49FC-9F99-330C4A50B5FA.JPG"];
for(let i=1;i<=20;i++)FILES.push("h"+i+".jpg");

window.__R=[];
(async()=>{
 const out=document.getElementById('out');
 let found=0;
 for(const f of FILES){
  const cell=document.createElement('div');
  cell.style.cssText='width:190px;border:1px solid #333;padding:4px;border-radius:4px';
  out.appendChild(cell);
  try{
   const bmp=await createImageBitmap(await (await fetch(P+f)).blob(),{imageOrientation:'from-image'});
   const r=FatterSevenSeg.read(bmp);
   const head=document.createElement('div');
   head.innerHTML=`<b>${f.slice(0,9)}</b><br>`+
     (r.ok?`<span style="color:${r.confident?'#6f6':'#fa0'};font-size:15px">${r.text}</span> `+
           `<span style="color:#888">${r.score.toFixed(2)}/${r.margin.toFixed(2)}</span>`
          :`<span style="color:#f66">${r.reason}</span>`);
   cell.appendChild(head);
   if(r.ok)found++;
   // thumbnail with the located box drawn on it
   const TW=180, sc=TW/bmp.width;
   const t=document.createElement('canvas'); t.width=TW; t.height=Math.round(bmp.height*sc);
   const tx=t.getContext('2d'); tx.drawImage(bmp,0,0,t.width,t.height);
   if(r.rect){tx.strokeStyle='#0f0';tx.lineWidth=2;tx.strokeRect(r.rect.x*sc,r.rect.y*sc,r.rect.w*sc,r.rect.h*sc);}
   t.style.cssText='width:180px;display:block;margin-top:3px';
   cell.appendChild(t);
   if(r.crop){r.crop.style.cssText='width:180px;image-rendering:pixelated;margin-top:3px';cell.appendChild(r.crop);}
   window.__R.push({f,ok:r.ok,text:r.ok?r.text:null,score:r.ok?+r.score.toFixed(2):null,margin:r.ok?+r.margin.toFixed(2):null,confident:r.ok?r.confident:false,reason:r.reason});
  }catch(e){cell.textContent=f+' ERR '+e.message; window.__R.push({f,ok:false,reason:'EX'});}
 }
 document.getElementById('sum').textContent=`located+decoded ${found}/${FILES.length}`;
 window.__DONE=true;
})();
</script>
